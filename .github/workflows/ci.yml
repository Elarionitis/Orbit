name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC, os: ubuntu-24.04, cc: gcc, cxx: g++, preset: release }
          - { name: Linux Clang, os: ubuntu-24.04, cc: clang, cxx: clang++, preset: release }
          - { name: Linux ASan+UBSan, os: ubuntu-24.04, cc: clang, cxx: clang++, preset: asan }
          - { name: Linux TSan, os: ubuntu-24.04, cc: clang, cxx: clang++, preset: tsan }
          - { name: macOS Clang, os: macos-latest, cc: clang, cxx: clang++, preset: release }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3
      - name: Allow TSan's memory layout
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2

  no-tls:
    name: Build without TLS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and test
        run: |
          cmake -B build -G Ninja -DORBIT_ENABLE_TLS=OFF -DORBIT_WERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t orbit .

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check clang-format
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

  fuzz:
    name: Fuzz decoders
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Build
        run: |
          cmake -B build/fuzz -G Ninja -DORBIT_BUILD_FUZZERS=ON -DORBIT_BUILD_TESTS=OFF \
            -DORBIT_BUILD_BENCH=OFF -DORBIT_ENABLE_TLS=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/fuzz --target fuzz_protocol fuzz_wal
      - name: Fuzz the wire protocol
        run: ./build/fuzz/fuzz/fuzz_protocol -max_total_time=120 -max_len=4096
      - name: Fuzz log recovery
        run: ./build/fuzz/fuzz/fuzz_wal -max_total_time=120 -max_len=4096
